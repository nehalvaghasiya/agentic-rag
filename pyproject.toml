[build-system]
requires = ["setuptools>=75", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "0.2.0"
description = "Bounded agentic RAG with typed tools, evaluation, citations and tenant-safe retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.12",
  "python-dotenv>=1,<2",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "numpy>=1.26,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "PyJWT>=2.8,<3",
  "prometheus-client>=0.20,<1",
  "opentelemetry-api>=1.26,<2",
  "opentelemetry-sdk>=1.26,<2",
  "langgraph>=1.0,<2",
  "mcp>=1.5,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.4,<1",
  "langgraph-checkpoint-postgres>=3,<5",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3,<6"]
hf = ["datasets>=3,<5"]

[dependency-groups]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8"]
quality = [
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "types-pyyaml>=6.0.12.20261113",
]
dev = [{include-group="test"}, {include-group="quality"}]

[project.scripts]
agentic-rag = "agentic_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_rag = ["resources/demo/*", "resources/skills/*"]

[tool.setuptools.data-files]
"share/agentic-rag/migrations" = ["infra/postgres/*.sql"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Header", "fastapi.Form"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
