minimum_pre_commit_version: '4.4.0'
repos:
  - repo: local
    hooks:
      - id: secret-scan
        name: Detect committed secrets
        entry: python3 -m devtools.secret_scan staged
        language: unsupported
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
        require_serial: true
